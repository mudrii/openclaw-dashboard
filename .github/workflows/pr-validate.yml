name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-body:
    name: Check PR template is filled out
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Validate PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const errors = [];

            // Must not be empty
            if (body.trim().length === 0) {
              errors.push('PR description is empty. Fill out the pull request template.');
            }

            // Must have exactly one Type ticked in the Type section.
            const typeMatch = body.match(/## Type\s*([\s\S]*?)(?=##|$)/);
            if (!typeMatch) {
              errors.push('"## Type" section is missing. Tick exactly one PR type.');
            } else {
              const checkedTypes = (typeMatch[1].match(/- \[x\]/gi) || []).length;
              if (checkedTypes !== 1) {
                errors.push(`Expected exactly one checked PR type, found ${checkedTypes}.`);
              }
            }

            // Summary must be substantial
            const summaryMatch = body.match(/## Summary\s*([\s\S]*?)(?=##|$)/);
            if (!summaryMatch || summaryMatch[1].trim().length < 20) {
              errors.push('"## Summary" is missing or too short. Describe what this PR does and why.');
            }

            // What Changed must have at least one real row
            const changedMatch = body.match(/## What Changed\s*([\s\S]*?)(?=##|$)/);
            const changedRows = changedMatch
              ? changedMatch[1].split('\n').filter(line => {
                  const trimmed = line.trim();
                  if (!trimmed.startsWith('|')) return false;
                  if (/^\|\s*File\s*\|/i.test(trimmed)) return false;
                  if (/^\|\s*-+\s*\|/.test(trimmed)) return false;
                  const cells = trimmed.split('|').slice(1, -1).map(cell => cell.trim());
                  return cells.length >= 2 && cells[0] !== '' && cells[1] !== '';
                })
              : [];
            if (changedRows.length === 0) {
              errors.push('"## What Changed" table has no entries. List files touched and what changed.');
            }

            // Checklist must be fully ticked
            const checklistSection = body.match(/## Checklist([\s\S]*?)(?=## |$)/);
            if (!checklistSection) {
              errors.push('"## Checklist" section is missing. Keep the checklist and complete all items.');
            } else {
              const boxes = checklistSection[1].match(/- \[[ x]\]/gi) || [];
              const unticked = (checklistSection[1].match(/- \[ \]/g) || []).length;
              if (boxes.length === 0 || unticked > 0) {
                errors.push(`PR checklist has ${unticked || 'missing'} unchecked item(s). Complete all items before requesting review.`);
              }
            }

            if (errors.length > 0) {
              const lines = [
                '## PR Template Validation Failed',
                '',
                'Fix the following before this PR can be reviewed:',
                '',
                ...errors.map(e => `- ${e}`),
                '',
                'See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for guidance.',
              ];
              core.setFailed(lines.join('\n'));
            } else {
              console.log('PR description looks good');
            }
