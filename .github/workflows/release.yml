name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token is required for cosign keyless signing via the GitHub OIDC issuer.
  id-token: write
  # NOTE: attestations: write is intentionally NOT granted yet. Add it back
  # when an actions/attest-build-provenance step is wired up; otherwise the
  # permission would be granted but unused.

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag commit $GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi

      - name: Verify release tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=VERSION::release tag $GITHUB_REF_NAME does not match VERSION file $version"
            exit 1
          fi

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint version

      - name: Validate release source
        run: make check

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning assets/runtime/refresh.sh
          shellcheck --severity=warning install.sh
          shellcheck --severity=warning uninstall.sh
          shellcheck --severity=warning scripts/container-smoke.sh

      - name: Verify runtime image
        run: make container-test

      - name: Install syft (SBOM generator)
        # Pin exact: floating @v0 will silently disappear when syft v1 → v2.
        # Dependabot's github-actions ecosystem watches exact versions.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign (keyless signing)
        # Pin exact: sigstore/cosign-installer does not publish a floating @v4
        # tag (only @v2 and @v3 exist as moving majors). Bump via dependabot.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate Homebrew tap credentials
        env:
          HOMEBREW_TAP_APP_CLIENT_ID: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_APP_CLIENT_ID" || {
            echo "::error::Set repository variable HOMEBREW_TAP_APP_CLIENT_ID to the GitHub App Client ID for mudrii/homebrew-tap"
            exit 1
          }
          test -n "$HOMEBREW_TAP_APP_PRIVATE_KEY" || {
            echo "::error::Set secret HOMEBREW_TAP_APP_PRIVATE_KEY to the GitHub App private key for mudrii/homebrew-tap"
            exit 1
          }

      - name: Mint homebrew-tap token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: mudrii
          repositories: homebrew-tap
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.4.5"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
